# Legacy / optional. Prefer Cloudflare Redirect Rules for gazimaksudur.me → gazimaksudur.dev
# (see README). Primary hosting is GitHub Pages at https://gazimaksudur.dev
#
# If you still deploy this site on Netlify for previews only, these host-based
# redirects apply when the request Host is *.gazimaksudur.me.

[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "http://gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true
