# Netlify is used only for gazimaksudur.me → gazimaksudur.dev redirects (+ optional preview).
# Primary hosting is GitHub Pages at https://gazimaksudur.dev

[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "http://gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gazimaksudur.me/*"
  to = "https://gazimaksudur.dev/:splat"
  status = 301
  force = true
