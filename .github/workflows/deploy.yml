name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Required so EmailJS secrets stored on the github-pages *environment*
    # (Settings → Environments → github-pages) are available at build time.
    # NEXT_PUBLIC_* values are inlined during `next build`; the deploy job
    # never sees them. Repository secrets also work with this environment set.
    environment: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify EmailJS secrets for build
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
        run: |
          missing=0
          for name in NEXT_PUBLIC_EMAILJS_SERVICE_ID NEXT_PUBLIC_EMAILJS_TEMPLATE_ID NEXT_PUBLIC_EMAILJS_PUBLIC_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty during build. Add it under Settings → Environments → github-pages → Environment secrets (or as a repository Actions secret), then re-run this workflow."
              missing=1
            else
              echo "$name is set (value hidden)."
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Contact form will fall back to mailto: until all three EmailJS secrets are visible to this build job."
            exit 1
          fi

      - name: Build static site
        env:
          NEXT_PUBLIC_EMAILJS_SERVICE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_SERVICE_ID }}
          NEXT_PUBLIC_EMAILJS_TEMPLATE_ID: ${{ secrets.NEXT_PUBLIC_EMAILJS_TEMPLATE_ID }}
          NEXT_PUBLIC_EMAILJS_PUBLIC_KEY: ${{ secrets.NEXT_PUBLIC_EMAILJS_PUBLIC_KEY }}
          NEXT_PUBLIC_GITHUB_OWNER: gazimaksudur2
          NEXT_PUBLIC_GITHUB_REPO: my-portfolio
          NEXT_PUBLIC_GITHUB_BRANCH: main
          NEXT_PUBLIC_SITE_URL: https://gazimaksudur.dev
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
